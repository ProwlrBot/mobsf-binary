# ── PLATFORM-6: Third-party self-update ──────────────────────────────────────
- id: android_third_party_apk_install
  message: >-
    App installs APKs from arbitrary sources (ACTION_INSTALL_PACKAGE or
    PackageInstaller.Session). This bypasses Play Store integrity checks and
    allows silent malware distribution. Requires REQUEST_INSTALL_PACKAGES.
  type: Regex
  pattern: 'ACTION_INSTALL_PACKAGE|PackageInstaller\.Session|downloadApk|installApk'
  severity: high
  input_case: exact
  metadata:
    cvss: 7.5
    cwe: cwe-494
    owasp-mobile: m8
    masvs: resilience-1

# ── PRIVACY-2: Device fingerprinting and advertising ID ──────────────────────
- id: android_device_fingerprinting
  message: >-
    App reads persistent device identifiers (IMEI, device serial, hardware
    MAC address) without confirmed user consent. Collecting these identifiers
    without disclosure violates MASVS-PRIVACY-2 and may breach GDPR/CCPA.
    Use resettable advertising ID with consent or AndroidId scoped to your app.
  type: RegexOr
  pattern:
    - 'TelephonyManager.*getDeviceId|getDeviceId\s*\(\s*\)'
    - 'getImei|getImsi|getSubscriberId'
    - 'READ_PHONE_STATE'
    - 'getHardwareAddress\(\)|BluetoothAdapter.*getAddress'
    - 'Build\.SERIAL|android\.os\.Build\.SERIAL'
  severity: warning
  input_case: exact
  metadata:
    cvss: 5.3
    cwe: cwe-359
    owasp-mobile: m1
    masvs: privacy-2
    ref: https://developer.android.com/training/articles/user-data-ids
- id: android_advertising_id
  message: >-
    App reads the Google Advertising ID (AdvertisingIdClient) or
    Settings.Secure.ANDROID_ID without a visible consent mechanism nearby.
    Advertising IDs must only be used for advertising with user consent per
    Google Play policy. ANDROID_ID is scoped per-app since Android 8 but still
    links sessions without consent.
  type: RegexOr
  pattern:
    - 'AdvertisingIdClient|getAdvertisingIdInfo'
    - 'Settings\.Secure\.ANDROID_ID'
    - 'isLimitAdTrackingEnabled'
  severity: warning
  input_case: exact
  metadata:
    cvss: 4.3
    cwe: cwe-359
    owasp-mobile: m1
    masvs: privacy-2
    ref: https://support.google.com/googleplay/android-developer/answer/6048248

